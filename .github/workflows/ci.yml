name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Express + Prisma)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  mobile:
    name: Mobile (React Native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test --silent

  dashboard:
    name: Dashboard (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    env:
      DATABASE_URL: 'file:./prisma/dev.db'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint --silent
        continue-on-error: true

  migrations:
    name: Migration lifecycle (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      # Ensure the psql client is available for the lifecycle check's object inventory.
      - name: Ensure psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      # Positively provision THIS ephemeral service container as a disposable
      # migration-test instance (the runner refuses to touch any instance that
      # lacks this sentinel). The `postgres` service is a throwaway container,
      # destroyed when the job ends — no persistent/shared/production database.
      - name: Provision disposable migration-test sentinel
        env: { PGPASSWORD: postgres }
        run: psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE flexpay_migtest_sentinel;"
      # Negative safety tests: the runner must FAIL CLOSED without isolation
      # evidence and must never drop a database it did not create this run
      # (incl. a decoy matching the old prisma_migrate_shadow% wildcard).
      - name: Migration runner safety tests
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres, PGADMINDB: postgres, MIGRATION_TEST_DISPOSABLE: '1' }
        run: bash scripts/migration-lifecycle-safety-test.sh
      # Real-PostgreSQL migration lifecycle: fresh deploy, schema parity, migrate dev +
      # shadow replay (proves the corrected M4 no longer trips 25001/P3006), a future
      # migration, object inventory, and a no-op repeat deploy. Disposable instance only
      # (sentinel-gated, run-owned cleanup) — no DATABASE_URL, KMS secrets, or customer data.
      - name: Prisma migration lifecycle (real PostgreSQL)
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres, PGADMINDB: postgres, MIGRATION_TEST_DISPOSABLE: '1' }
        run: bash scripts/migration-lifecycle-check.sh
