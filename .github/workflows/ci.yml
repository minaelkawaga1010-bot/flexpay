name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default GITHUB_TOKEN for every job: read-only repository
# contents. No job pushes, comments, creates releases, or uploads artifacts, so
# none needs a write scope (TASK-018.4B-I9D). A job that later needs more must
# opt in explicitly and narrowly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Express + Prisma)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  mobile:
    name: Mobile (React Native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test --silent

  dashboard:
    name: Dashboard (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    env:
      DATABASE_URL: 'file:./prisma/dev.db'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint --silent
        continue-on-error: true

  migrations:
    name: Migration lifecycle (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      # Ensure the psql client is available for the lifecycle check's object inventory.
      - name: Ensure psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      # Positively provision THIS ephemeral service container as a disposable
      # migration-test instance (the runner refuses to touch any instance that
      # lacks this sentinel). The `postgres` service is a throwaway container,
      # destroyed when the job ends — no persistent/shared/production database.
      - name: Provision disposable migration-test sentinel
        env: { PGPASSWORD: postgres }
        run: psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE flexpay_migtest_sentinel;"
      # Negative safety tests: the runner must FAIL CLOSED without isolation
      # evidence and must never drop a database it did not create this run
      # (incl. a decoy matching the old prisma_migrate_shadow% wildcard).
      - name: Migration runner safety tests
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres, PGADMINDB: postgres, MIGRATION_TEST_DISPOSABLE: '1' }
        run: bash scripts/migration-lifecycle-safety-test.sh
      # Real-PostgreSQL migration lifecycle: fresh deploy, schema parity, migrate dev +
      # shadow replay (proves the corrected M4 no longer trips 25001/P3006), a future
      # migration, object inventory, and a no-op repeat deploy. Disposable instance only
      # (sentinel-gated, run-owned cleanup) — no DATABASE_URL, KMS secrets, or customer data.
      - name: Prisma migration lifecycle (real PostgreSQL)
        env: { PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres, PGADMINDB: postgres, MIGRATION_TEST_DISPOSABLE: '1' }
        run: bash scripts/migration-lifecycle-check.sh

  e2e:
    name: Application E2E (PostgreSQL 16 + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Ephemeral service containers = the positive disposability provenance:
    # created fresh for this job and destroyed when it ends. Never an external,
    # shared, or persistent database. tests/e2e/setup.ts injects random
    # per-process JWT/webhook secrets and synthetic PII keys — no production KMS,
    # credentials, or customer data.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/flexpay_e2e?schema=public'
      BACKFILL_DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/flexpay_e2e_bf?schema=public'
      REDIS_URL: 'redis://127.0.0.1:6379'
      # Explicit disposability assertion — set ONLY in this ephemeral-service job.
      # localhost + a test database name alone are NOT sufficient isolation proof.
      E2E_TEST_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: Ensure psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      # Adversarial self-test of the isolation gate (pure bash; no DB/service):
      # proves it fails closed on every unsafe target and that a valid value in
      # one DB URL can never MASK an unsafe value in the other.
      - name: E2E isolation guard safety tests
        run: bash scripts/e2e-verify-disposable-targets.safety-test.sh
      # Fail-closed isolation gate, BEFORE any destructive setup/test. Validates
      # EACH target (DATABASE_URL, BACKFILL_DATABASE_URL, REDIS_URL) INDEPENDENTLY
      # and STRUCTURALLY against the exact disposable service host/port/db — no
      # concatenated-string marker match, so no target can mask another. The
      # explicit E2E_TEST_DISPOSABLE=1 assertion is required but never sufficient
      # alone; prod/staging/external/ambiguous/malformed targets are refused.
      - name: Verify disposable test targets
        run: bash scripts/e2e-verify-disposable-targets.sh
      - name: Provision disposable E2E databases
        env: { PGPASSWORD: postgres }
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE flexpay_e2e;"
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE flexpay_e2e_bf;"
          npx prisma db push --skip-generate
          DATABASE_URL="$BACKFILL_DATABASE_URL" npx prisma db push --skip-generate
      # Run the COMPLETE application E2E suite (all 16 *.e2e.test.ts), serialised
      # and FAIL-CLOSED: any failing assertion fails the job (no continue-on-error,
      # no test selection, no retry). NOTE: `prisma db push` here only syncs the
      # schema for disposable application tests — it does NOT validate the Prisma
      # migration history; that is the separate `migrations` job.
      - name: Application E2E (full suite)
        run: npx jest --config jest.e2e.config.js --runInBand --ci
